---
# KUBECONFIG CHECK — Runtime automation identity end-to-end test
# Verifies that the k8s_kubeconfig extravar (populated by zerotouch-automation
# from the runtime-automation-kubeconfig Secret -- see the
# ocp4_workload_showroom_runtime_automation_* variables in agnosticd/showroom's
# ocp4_workload_showroom role) is present and actually grants access beyond
# the pod's own namespace-scoped `edit` ServiceAccount.
#
# Exit 0 = the elevated identity works as expected, non-zero = it doesn't.

- name: Runtime Automation Identity Check
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # Computed once via set_fact rather than a play-level `vars:` -- `vars:`
    # with a `| random` filter is lazily re-templated on every reference, so
    # the create/message/cleanup tasks below would each get a different
    # random number, leaving the actually-created namespace un-deleted.
    - name: Generate throwaway namespace name
      ansible.builtin.set_fact:
        test_namespace: >-
          runtime-automation-identity-check-{{ 999999 | random }}

    - name: Check k8s_kubeconfig extravar is present
      ansible.builtin.assert:
        that:
          - k8s_kubeconfig is defined
          - k8s_kubeconfig | length > 0
        fail_msg: >-
          k8s_kubeconfig extravar is not set. Ensure
          ocp4_workload_showroom_runtime_automation_enable is true and that
          the runtime-automation-kubeconfig Secret exists in the showroom
          namespace (ocp4_workload_showroom_runtime_automation_* variables).
        success_msg: k8s_kubeconfig extravar is present.

    - name: Kubeconfig file referenced by k8s_kubeconfig exists and is non-empty
      ansible.builtin.stat:
        path: "{{ k8s_kubeconfig }}"
      register: kc_stat
      failed_when: not kc_stat.stat.exists or kc_stat.stat.size == 0

    - name: List namespaces cluster-wide using the runtime automation identity
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_kubeconfig }}"
        api_version: v1
        kind: Namespace
      register: cluster_namespaces
      # The pod's own `edit` SA is scoped to the showroom namespace only, so
      # it could never see more than 1 namespace here -- proves the identity
      # is genuinely elevated, not just falling back to the default SA.
      failed_when: cluster_namespaces.resources | length < 2

    - name: Create a throwaway namespace using the runtime automation identity
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ test_namespace }}"
            labels:
              created-by: ph-openshift-monorepo-example-qa-automation
      register: create_test_ns

    - name: Namespace creation succeeded (proves cluster-admin-level access)
      ansible.builtin.assert:
        that:
          - create_test_ns is succeeded
        fail_msg: >-
          Failed to create a namespace using k8s_kubeconfig -- the runtime
          automation identity does not have sufficient (cluster-admin)
          access.
        success_msg: >-
          Created namespace {{ test_namespace }} using the runtime
          automation identity -- elevated access confirmed.

    - name: Clean up throwaway namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ test_namespace }}"
      when: create_test_ns is succeeded
