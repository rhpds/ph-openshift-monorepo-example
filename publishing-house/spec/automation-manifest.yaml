# Automation Manifest
# Describes what the lab/demo environment needs pre-configured.
# Generated by the automation agent from content analysis, or provided directly.
# Review and approve this before automation code is written.
#
# See the automation manifest format guide for field reference.

approach: both

infrastructure:
  type: ocp-cnv
  ocp_version: "4.20"
  multi_user: false
  users_per_deployment: 1

operators:
  - Red Hat OpenShift GitOps
  - Red Hat Build of Keycloak

applications:
  - monorepo-demo namespace (GitOps)
  - monorepo-demo-{{ guid }} namespace (Ansible)
  - busybox pod (Ansible)

rbac: []
seed_data: []
network: []
broken_resources: []
provision_data: []
notes: "Auth via Keycloak. Showroom SA needs cluster-admin for ZT runner."
