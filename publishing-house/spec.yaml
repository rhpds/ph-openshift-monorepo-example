# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "ph-openshift-monorepo-example"
  owner_email: "psrivast@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "both"
  description: "This hands-on lab introduces a monorepo-based approach for building and managing technical labs through Publishing House.  Participants will work from a single Git repository that contains the lab content, Showroom configuration, GitOps resources, Ansible automation, and the Ansible collections required by the lab. Instead of maintaining content and automation across multiple repositories, the complete lab lifecycle is managed and versioned together.  During the lab, participants will use Publishing House to scaffold the lab structure, build the learner experience with Showroom, deploy required platform components through GitOps, and use Ansible collections from the same repository to configure and prepare the environment.  The lab demonstrates how a monorepo can simplify development, testing, versioning, and ongoing maintenance while still keeping clear boundaries between content, infrastructure configuration, and automation. Participants will leave with a practical understanding of how Publishing House can provide a repeatable development workflow for labs that need Showroom, GitOps, and Ansible working together. "
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1130"
  workflow_id: "c9c0f55f-f291-49de-af48-083d8154f88e"

spec:
  title: "Publishing House Monorepo: Showroom, GitOps, and Ansible in a Single Repository"
  learning_objectives:
    - "Explore the structure of a Publishing House monorepo that integrates Showroom content, GitOps resources, and Ansible automation"
    - "Deploy lab infrastructure components using the GitOps and Ansible automation included in the monorepo"
  modules:
    - id: module-01
      title: "Exploring the Monorepo Structure"
      duration_min: 20
      status: complete
    - id: module-02
      title: "Deploying with GitOps and Ansible"
      duration_min: 20
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                 # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "sno"                 # sno | multinode — only for platform = ocp
    control_plane_instance_count: 1     # 1 if sno, 3 if multinode
    control_plane_cpu: 32               # 32 if sno, 16 if multinode
    control_plane_ram_gb: 128           # 128 if sno, 64 if multinode
    worker_count: 0                     # number of OCP worker nodes
    worker_cpu: null                    # vCPU per worker
    worker_ram_gb: null                 # RAM per worker in GB
    worker_disk_gb: null                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                      # required if AAP in products
    ai_requirement: "none"              # maas | gpu | none
    ai_model_tier: ""                   # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                   # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:
      - registry.redhat.io
      - quay.io
      - github.com
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 0.67
  audience: "beginner"               # beginner | intermediate | advanced

development:
  automation:
    gitops:
      status: in_progress
    ansible:
      status: in_progress
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "No existing catalog item targets lab authors building RHDP labs in a monorepo pattern. Every GitOps and Ansible lab in the catalog targets application developers or SEs deploying production workloads. This design uniquely covers the Publishing House development workflow itself — combining Showroom content, GitOps infrastructure, and Ansible automation in a single repository — for a beginner audience of content developers."
    design_overview: "This beginner lab teaches lab authors and content developers how Publishing House uses a monorepo to co-locate Showroom content, OpenShift GitOps manifests, and Ansible automation in a single Git repository. Participants explore a pre-built example monorepo, trace how each layer is organized, and then deploy the example environment using the included GitOps and Ansible automation. The lab addresses a gap in the existing catalog: no current item targets RHDP lab authors learning the Publishing House development workflow."
    module_summaries:
      - title: "Exploring the Monorepo Structure"
        overview: "Participants navigate a pre-cloned example monorepo to identify and understand the role of the Showroom content layer, GitOps resources, and Ansible collection. By the end, they can explain how versioning all three layers together in a single repository simplifies lab lifecycle management."
      - title: "Deploying with GitOps and Ansible"
        overview: "Participants deploy the example lab environment using provided commands that apply GitOps manifests via ArgoCD and execute Ansible automation from the monorepo collection. They verify the deployed resources and observe how the two automation layers divide responsibility within a single, version-controlled repository."
    rcars_overlap_pct: 82
    rcars_top_matches:
      - title: "Service Enablement: App Platform Software Factory"
        ci_name: "openshift-cnv.app-platform-factory-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.app-platform-factory-cnv.prod"
        relevance_score: 82
        why_it_fits: "Covers GitOps with Argo CD and OpenShift as core components, which aligns with the GitOps pillar of this design. Does not include AAP or monorepo/Showroom lab content structure."
        workloads:
          - role: "ocp4_workload_authentication"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_gitops_bootstrap"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_ocp_console_embed"
            collection: "agnosticd.showroom"
          - role: "ocp4_workload_openshift_gitops"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
      - title: "OpenShift GitOps Workshop"
        ci_name: "sandboxes-gpte.ocp-gitops.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.ocp-gitops.prod"
        relevance_score: 80
        why_it_fits: "Directly covers OpenShift GitOps (Argo CD) hands-on deployment workflows. No Ansible, no monorepo structure — covers only the GitOps pillar at intermediate difficulty."
        workloads: []
      - title: "OpenShift Advanced App Platform Demo"
        ci_name: "published.ocp4-adv-app-platform-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp4-adv-app-platform-demo.prod"
        relevance_score: 73
        why_it_fits: "Includes GitOps with Argo CD as part of a broader platform story. Advanced-level sales demo for SEs — no Ansible, no monorepo/Showroom lab content pattern."
        workloads: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
